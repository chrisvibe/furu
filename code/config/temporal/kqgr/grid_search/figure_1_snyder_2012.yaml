# DOI: 10.1162/978-0-262-31050-5-ch035 figure 1 a) and b)
logging:
  out_path: 'out/temporal/kqgr/grid_search/snyder_2012/figure1'
  save_keys: null
  grid_search:
    n_samples: 25 # compensate for large variance
    run: ['kqgr']
model:
  input_layer:
    perturbation: override
    encoding: base2
    features: 1
    redundancy: 1
    resolution: 1 # 1-bit-per-step; 10 steps from dataset.bits=10 via the s-dimension
    ticks: '1' # one LUT update per step
  reservoir_layer:
    init: random # not specified in snyder; the init sweep lives in the PI grids
    n_nodes: 25 # R.n_nodes: 25 in paper
    p: 0.5 # unbiased random LUTs
    reset: true # not specified, assume snyder resets the reservoir to the same init for a given readout before inputs are applied
  training: # optim unused on KQ/GR plots (no readout training); explicit for consistency
    accuracy_threshold: 0.5
    epochs: 1
    evaluation: dev
    optim:
      name: bernoulli
      params:
        alpha: 0.0 # unpenalised Bernoulli GLM (logit link), Newton-IRLS, max 50 steps
  output_layer:
    n_nodes: 1
    heads: [time-series, classification] # summed states vs last state only (snyder's); both from one run
dataset:
  task: density
  bits: 10 # 10-step temporal sequence; each step injects 1 bit into 1 I-node
  window: 3 # not used; window/delay don't affect KQ/GR scores
  delay: 0  # not used; window/delay don't affect KQ/GR scores
  split:
    train: 0
    dev: 1
    test: 0
  samples: 1024 # 2**10=1024 input combinations
  sampling_mode: 'exhaustive'
  evaluation: 'last' # low rank means we forget previous inputs -> presence of ESP
  tau: 3 # not specified in snyder (2**(10-tau) >= 25 caps it at 5); the tau sensitivity lives in the PI grids
  tau_axis: steps # temporal sequence lives in the s-dimension (1 bit per reservoir step)
  tau_mode: steal # 10 bits - tau for making GR
  independent: true # preserve the Snyder 2012 replication's established methodology:
    # KQ and GR each drawn independently, not paired from one shared pool (the default
    # elsewhere) — keeps this config's numbers comparable to the published definition.
  shuffle: false
  seed: 0
multiverse_overrides:
  # The paper's driven-vs-autonomous replication: KQ/GR against k_avg under
  # three input wirings, 25-node reservoirs.
  #
  # Theme 1 (real):       faithful Snyder: joint (I+R)->R draw, so the input node gets no
  #                       edge with probability ~e^-k_avg and the reservoir runs autonomous.
  #                       Both topology modes, to compare against the published figure 1 a/b.
  # Theme 2 (decoupled):  I->R and R->R drawn independently, I->R k_avg = K/(N+I) matching
  #                       Snyder's marginal: separating the draw alone, the input can still miss.
  # Theme 3 (identity):   I->R a fixed identity pattern, every input copy wired to its own
  #                       reservoir node, so the reservoir is driven at every k_avg; redundancy
  #                       {1, 3, 5} sets how many reservoir nodes the input drives.
  # Anchors (&/*) are resolved by PyYAML before Pydantic sees the dict.

  # -- THEME 1: REAL SNYDER --------------------------------------------------------------
  kqgr_homogeneous_real:
    model:
      variables:
        R_k_avg: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      wiring:
        - &b_to_i
          type: pattern
          source: B
          target: I
          pattern: identity
        - type: gnm
          source: "I+R"
          target: "R"
          k_min: 0
          k_avg: "R_k_avg"
          k_max: 25
          mode: homogeneous
  kqgr_heterogeneous_real:
    model:
      variables:
        R_k_avg: &k_het0 [0.0, 0.08, 0.2, 0.28, 0.4, 0.48, 0.6, 0.68, 0.8, 0.88, 1.0, 1.08, 1.2, 1.28, 1.4, 1.48, 1.6, 1.68, 1.8, 1.88, 2.0, 2.08, 2.2, 2.28, 2.4, 2.48, 2.6, 2.68, 2.8, 2.88, 3.0, 3.08, 3.2, 3.28, 3.4, 3.48, 3.6, 3.68, 3.8, 3.88, 4.0, 4.08, 4.2, 4.28, 4.4, 4.48, 4.6, 4.68, 4.8, 4.88, 5.0, 5.08, 5.2, 5.28, 5.4, 5.48, 5.6, 5.68, 5.8, 5.88, 6.0, 6.08, 6.2, 6.28, 6.4, 6.48, 6.6, 6.68, 6.8, 6.88, 7.0, 7.08, 7.2, 7.28, 7.4, 7.48, 7.6, 7.68, 7.8, 7.88, 8.0]
      wiring:
        - *b_to_i
        - type: gnm
          source: "I+R"
          target: "R"
          k_min: 0
          k_avg: "R_k_avg"
          k_max: 25
          mode: heterogeneous

  # -- THEME 2: DECOUPLED ----------------------------------------------------------------
  kqgr_heterogeneous:
    model:
      variables:
        R_k_avg: *k_het0
        R_mode: heterogeneous
      wiring:
        - *b_to_i
        - type: gnm
          source: I
          target: R
          k_min: 0
          k_avg: "R_k_avg / (I_n_nodes + R_n_nodes)"
          k_max: "I_n_nodes"
          mode: heterogeneous
        - &r_to_r
          type: gnm
          source: R
          target: R
          k_min: 0
          k_avg: "R_k_avg"
          k_max: 25
          mode: "R_mode"

  # -- THEME 3: DEDICATED I->R, REDUNDANCY AS THE DRIVE ---------------------------------
  kqgr_heterogeneous_identity:
    model:
      input_layer:
        redundancy: [1, 3, 5]
        # the derived widths come from the base config's dump: clear them so they are
        # recomputed for each redundancy (a universe override starts from a validated dump)
        bits: null
        n_nodes: null
        chunk_size: null
        chunks: null
      variables:
        R_k_avg: [1.0, 1.08, 1.2, 1.28, 1.4, 1.48, 1.6, 1.68, 1.8, 1.88, 2.0, 2.08, 2.2, 2.28, 2.4, 2.48, 2.6, 2.68, 2.8, 2.88, 3.0, 3.08, 3.2, 3.28, 3.4, 3.48, 3.6, 3.68, 3.8, 3.88, 4.0, 4.08, 4.2, 4.28, 4.4, 4.48, 4.6, 4.68, 4.8, 4.88, 5.0, 5.08, 5.2, 5.28, 5.4, 5.48, 5.6, 5.68, 5.8, 5.88, 6.0, 6.08, 6.2, 6.28, 6.4, 6.48, 6.6, 6.68, 6.8, 6.88, 7.0, 7.08, 7.2, 7.28, 7.4, 7.48, 7.6, 7.68, 7.8, 7.88, 8.0]
        R_mode: heterogeneous
      wiring:
        - *b_to_i
        - type: pattern
          source: I
          target: R
          pattern: identity
        - *r_to_r
