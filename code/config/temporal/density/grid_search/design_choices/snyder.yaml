# Snyder-style grid — density.
#
# Purpose: reproduce Snyder's diminishing-returns-in-k curve HONESTLY
# and attribute it. Two universes, same seeds/datasets:
#   snyder     = his wiring: gnm I+R -> R (each node's k inputs drawn
#                from the input+reservoir pool) => input fan-in grows
#                ~0.02k — his k axis raises BANDWIDTH and mixing
#                together. His curve reproduces: 0.49 (k1) -> 0.89
#                (k12), honest.
#   guaranteed = our identity B->I->R + R->R gnm: bandwidth pinned at
#                `redundancy`, k is mixing only. red 30 matches his
#                k=12 fan-in and his accuracy (0.90 ~ 0.89).
# n_nodes 500 = his size (the all_* grids use 512).
# bits 10 = his T=10; honest split via samples 1024 + shuffle true
# (every stream exactly once; shuffle REQUIRED — unshuffled arange
# puts first-bit=0 streams in train, first-bit=1 in dev).
# Homogeneous k = his RBNs (fixed in-degree); also memory-safe.
#
# Jobs: 2 universes x 10 k x 2 red x 3 window x 3 delay x 5 seeds
#     = 3,600 @ 500 nodes.
logging:
  out_path: out/temporal/density/grid_search/design_choices/snyder
  save_keys: null
  grid_search:
    n_samples: 5
    run: [train]
model:
  wiring:
  - type: pattern
    source: B
    target: I
    pattern: identity
  - type: gnm
    source: "I+R"
    target: R
    k_avg: R_k_avg
    k_min: 0
    k_max: 25
    self_loops: null
    mode: R_mode
  input_layer:
    perturbation: override
    encoding: base2
    features: 1
    resolution: 1
    redundancy: [1, 3]
    ticks: '1'
  output_layer:
    n_nodes: 1
    mode: time-series
  reservoir_layer:
    init: random
    n_nodes: 500
    reset: true
  training:
    epochs: 1
    evaluation: dev
    optim:
      name: bernoulli
      params:
        alpha: 1.0e-6 # Bernoulli GLM (logit link), Newton-IRLS: smallest well-posed alpha
  variables:
    R_k_avg: [1, 2, 3, 4, 5, 6, 7, 8, 10, 12]
    R_mode: homogeneous
dataset:
  name: temporal
  task: density
  bits: 10
  window: [1, 3, 5]
  delay: [1, 3, 5]
  split:
    train: 0.5
    dev: 0.5
    test: 0
  samples: 1024
  sampling_mode: exhaustive
  shuffle: true
  seed: 0
multiverse_overrides:
  snyder: {}
  guaranteed:
    model:
      input_layer:
        redundancy: [1, 3, 30]
      wiring:
      - type: pattern
        source: B
        target: I
        pattern: identity
      - type: pattern
        source: I
        target: R
        pattern: identity
      - type: gnm
        source: R
        target: R
        k_avg: R_k_avg
        k_min: 0
        k_max: 25
        self_loops: null
        mode: R_mode
